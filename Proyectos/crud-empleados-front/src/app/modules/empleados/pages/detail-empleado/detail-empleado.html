@if(spinner){
<app-spinner></app-spinner>
}@else{
    <div class="row">
        <div class="col">
            <h1>Detalle empleado</h1>
        </div>
        <div class="col text-end">
            <p-button [routerLink]="['/empleados/list-empleados']" icon="pi pi-undo"></p-button>
        </div>
    </div>

    <div class="row">
        <div class="col">
            <h2>Nombre: {{empleado.nombre}}</h2>
        </div>
    </div>
    <div class="row">
        <div class="col">
            <h2>Apellido: {{empleado.apellido}}</h2>
        </div>
    </div>
}
